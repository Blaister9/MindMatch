services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindmatch
      POSTGRES_PASSWORD: mindmatch
      POSTGRES_DB: mindmatch
    ports:
      - "5432:5432"
    volumes:
      - mindmatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindmatch -d mindmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindmatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mindmatch-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mindmatch-pgdata:
  mindmatch-redisdata:
